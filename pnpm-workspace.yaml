ignoreWorkspaceRootCheck: true
catalogMode: strict
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true
savePrefix: ''

packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  simple-git-hooks: true

catalog:
  '@antfu/eslint-config': 10.0.0
  '@types/node': 26.6.6
  '@typescript/native': 'npm:typescript@7.1.0-beta'
  eslint: 10.15.0
  eslint-plugin-format: 2.0.1
  eslint-plugin-slop: 0.1.3
  eslint-plugin-sonarjs: 4.2.2
  jiti: 2.7.0
  lint-staged: 17.6.1
  simple-git-hooks: 2.14.0
  tsdown: 0.23.7
  turbo: 2.11.13
  typescript: 'npm:@typescript/typescript6@6.0.2'

permissions:
  tsdown:
    skills: true

skills:
  dirs:
    - .agents/skills
